<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アイテム・カウンター ＆ クイズガイド</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #55ff00;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            
            /* 画面のどこをドラッグしてもウィンドウを動かせる設定 */
            -webkit-app-region: drag;
            user-select: none;
        }

        /* ウィンドウ上部のボタン配置エリア */
        .top-menu {
            width: 100%;
            max-width: 1000px;
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        /* ボタンの共通ベーススタイル */
        .menu-btn {
            color: white;
            font-size: 1rem;
            font-weight: bold;
            border: 2px solid #fff;
            padding: 10px 24px;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.15);
            transition: background 0.2s, transform 0.1s;
            
            /* ボタンはドラッグ対象から除外（クリックを有効にするため） */
            -webkit-app-region: no-drag;
        }

        .menu-btn:active {
            transform: scale(0.95);
        }

        /* 強制終了ボタン（赤） */
        .kill-button { background-color: #ff3b30; }
        .kill-button:hover { background-color: #e03126; }

        /* リセットボタン（オレンジ） */
        .reset-button { background-color: #ff9500; }
        .reset-button:hover { background-color: #e68600; }

        /* クイズ詳細ナビゲーションボード（横幅を820pxに固定） */
        .quiz-navi-box {
            background: #222;
            color: #fff;
            padding: 15px 24px;
            border-radius: 14px;
            width: 820px;
            margin-bottom: 20px;
            border: 2px solid #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            box-sizing: border-box;
            text-align: left;
        }
        
        /* 「次の問題: Q1」の部分 */
        .quiz-title {
            font-size: 1.6rem;
            color: #aaa;
            margin-bottom: 6px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        /* 💥 クイズの問題文（フォント2rem ＆ 3行分の高さで完全固定） */
        .quiz-question {
            font-size: 2.1rem;
            font-weight: bold;
            color: #fff;
            margin-bottom: 12px;
            line-height: 1.3;
            white-space: pre-line;
            
            /* 💥 高さを「フォントサイズ2rem × 行間1.3 × 3行分」に変更して完全固定 */
            height: calc(2rem * 1.3 * 2); 
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            overflow: hidden;
        }

        /* 正解のボタン＆テキストエリア全体 */
        .quiz-answer-row {
            font-size: 2.2rem;
            font-weight: bold;
            color: #ffeb3b; 
            border-top: 2px dashed #444;
            padding-top: 10px;
            display: flex;
            align-items: center;
        }

        /* 「正解のボタン」という黄色いラベル */
        .ans-label {
            background: #ffeb3b;
            color: #222;
            padding: 4px 14px;
            border-radius: 6px;
            font-size: 1.1rem;
            margin-right: 14px;
            font-weight: bold;
        }

        /* 横並びベースの設定（ハテナ虫と料理） */
        .grid-container {
            display: flex;
            gap: 24px;
            justify-content: center;
            width: 820px;
            box-sizing: border-box;
        }

        /* カード全体の幅 */
        .card {
            background: white;
            padding: 15px;
            border-radius: 18px;
            text-align: center;
            width: 398px; 
            box-sizing: border-box;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        /* 画像サイズ270px */
        .click-image {
            width: 270px;
            height: 270px;
            object-fit: cover; 
            border-radius: 12px;
            -webkit-user-drag: none;
            margin-bottom: 10px;
            background-color: #ffffff;
            display: inline-block;
            cursor: default; /* クリック無効のためカーソルを通常に */
        }

        /* カウント表示 */
        .count-display {
            font-size: 3.5rem;
            font-weight: bold;
            color: #333;
            line-height: 1;
        }
    </style>
</head>
<body>

    <div class="top-menu">
        <button id="appResetBtn" class="menu-btn reset-button">画像をリセット</button>
        <button id="appKillBtn" class="menu-btn kill-button">アプリを強制終了する</button>
    </div>

    <div class="quiz-navi-box" id="quizNavi">
        <div class="quiz-title" id="quizNumberText">次の問題: Q1</div>
        <div class="quiz-question" id="quizQuestionText">読み込み中...</div>
        <div class="quiz-answer-row">
            <span class="ans-label">正解のボタン</span>
            <span id="quizAnswerText">読み込み中...</span>
        </div>
    </div>

    <div class="grid-container">

        <div class="card" data-max="64">
            <img src="C:\Users\origa\Desktop\my-counter-app\quizmo.png" alt="ハテナ虫" class="click-image">
            <div class="count-display">0 / 64</div>
        </div>

        <div class="card" data-max="50">
            <img src="C:\Users\origa\Desktop\my-counter-app\cook.png" alt="料理" class="click-image">
            <div class="count-display">0 / 50</div>
        </div>

    </div>

    <script>
        const quizList = [
            { q: "クリオの妹の名前は何？", a: "下 (3) ：クリコ" },
            { q: "最初に手に入れたハンマーで壊すことのできるブロックの色は？", a: "中 (2) ：黄色" },
            { q: "クリオの得意ワザは何？", a: "中 (2) ：ものしり" },
            { q: "クリキングが はいていたパンツの色は何色？", a: "下 (3) ：赤としろ" },
            { q: "マリオのバトルコマンド 一番左にあるコマンドは何？", a: "下 (3) ：さくせん" },
            { q: "クリ村のクリハウス 窓は全部でいくつあった？", a: "上 (1) ：1つ" },
            { q: "クリレッド＆クリブルーの兄弟の親分の名前は何？", a: "下 (3) ：クリキング" },
            { q: "ルイージのはいているズボンの色は？", a: "上 (1) ：青色" },
            { q: "クリオの家族は全部で何人？", a: "下 (3) ：６人" },
            { q: "クイズに正解すると貰えるのは？", a: "中 (2) ：ほしのかけら" },
            { q: "キノコタウンに住んでいる物知りキノピオの名前は何？", a: "上 (1) ：キノポン" },
            { q: "ノコノコ村に建物は全部で何軒あった？", a: "下 (3) ：６けん" },
            { q: "ノコブロスの中にいなかったヤツは次のうちどれ？", a: "中 (2) ：ノコブルー" },
            { q: "ノコノコ村のお店で売っている『キノコ』の値段は何コイン？", a: "中 (2) ：４コイン" },
            { q: "探し物を占ってくれるミステールが住んでいるところはどこ？", a: "上 (1) ：星のふるおか" },
            { q: "ノコブロスの砦で仲間になったキャラクターの名前は何？", a: "下 (3) ：ピンキー" },
            { q: "クッパの髪の毛の色は？", a: "上 (1) ：赤色" },
            { q: "マリオが助けなければならない星の精は全部で何人？", a: "下 (3) ：７人" },
            { q: "ノココノ村でいつもおつかいを頼んでくる長老ノコノコの名前は何？", a: "中 (2) ：ノコジロウ" },
            { q: "ノコブロスの砦の牢屋でピンキーと一緒に捕まっていたボムへいは何人いた？", a: "上 (1) ：４人" },
            { q: "探検家のチャールズの家があるところはどこ？", a: "上 (1) ：ノコノコ村" },
            { q: "キノコタウンの駅から出発する汽車はどこ行き？", a: "下 (3) ：ゴツゴツ山" },
            { q: "キノコタウンでバッジを売っているお店の主人の名前は何？", a: "中 (2) ：ロテン" },
            { q: "クッパが星の国から奪っていった宝物は何？", a: "上 (1) ：スターのつえ" },
            { q: "ノコノコ村でラジオを聞くことができる家の屋根の色は？", a: "下 (3) ：青色" },
            { q: "カメキが尊敬している人は誰？", a: "中 (2) ：チャールズ" },
            { q: "カラカラタウンにいるサンデールはどんなことをしているお姉さん？", a: "中 (2) ：おまじない" },
            { q: "アラビン遺跡のカンオケの中に隠れていたのは？", a: "下 (3) ：サンボマミー" },
            { q: "星のふるおかのアツメールのところに『ほしのかけら』を持っていくと何と交換してくれる？", a: "下 (3) ：バッジ" },
            { q: "カラカラ砂漠のアラビン遺跡、その在処を知っていたのは誰？", a: "中 (2) ：ロレンチュ" },
            { q: "料理が得意なキャシーに『レモンあめ』を作ってもらうには、『レモン』と何を渡せばいい？", a: "中 (2) ：おかしのもと" },
            { q: "次のうち迷いの森に住んでいるのは誰？", a: "中 (2) ：モーリー" },
            { q: "テレサってずばり何？", a: "上 (1) ：オバケ" },
            { q: "ゴツゴツ山にいるコブロン 叩くと何が出てくる？", a: "下 (3) ：タンコブ" },
            { q: "砂漠のオアシスの木を叩くと実が落ちるが『レモン』ともう１つは何？", a: "下 (3) ：ライム" },
            { q: "キノコタウンにいるマリオの能力を上げてくれる怪しい人の名前は何？", a: "下 (3) ：レベーラ" },
            { q: "ピンキーの得意ワザは何？", a: "下 (3) ：バクハツ" },
            { q: "グルメヘイホーは何が好き？", a: "上 (1) ：ケーキ" },
            { q: "２番目にマリオの仲間になったのは誰？", a: "中 (2) ：カメキ" },
            { q: "砂漠でマリオ達からコインを盗しようとするのは誰？", a: "中 (2) ：ボロドー" },
            { q: "『ほしのふるよる』のワザを使う星の精の名前は何？", a: "下 (3) ：ハール" },
            { q: "郵便局には仲間宛に何が届く？", a: "中 (2) ：手紙" },
            { q: "キノコタウンにない建物は次のうちどれ？", a: "下 (3) ：村長の家" },
            { q: "グルメヘイホーが落としていっのは何の本？", a: "中 (2) ：おりょうり" },
            { q: "わたしの名前は？", a: "下 (3) ：ハテナ虫" },
            { q: "わたしが現れるのはどんなところ？", a: "上 (1) ：まち や 村" },
            { q: "ジャングルに生えている星を吹き出す草の名前は？", a: "上 (1) ：ラッパ草" },
            { q: "ヨッシー村の村長は何色のヨッシーだった？", a: "中 (2) ：みどり色" },
            { q: "キノコタウンで占いをしてくれる おじいさんの名前は何？", a: "中 (2) ：デアール" },
            { q: "ヨッシー村にいたヨッシーの色は全部で何種類？", a: "上 (1) ：６しゅるい" },
            { q: "ヨッシー村で おプクはチビヨッシー達に何と言われていた？", a: "中 (2) ：おせっかい" },
            { q: "キノコタウン郵便局の向かいにある建物は何？", a: "下 (3) ：デアールの家" },
            { q: "キノコタウンにある道場でリーに勝ったら貰えるものは何段の証？", a: "中 (2) ：２だん" },
            { q: "ピーチ姫が胸に付けているブローチの色は何色？", a: "上 (1) ：青色" },
            { q: "フラワーランドで『おいしいみず』をくれたのは誰？", a: "下 (3) ：スイレーン" },
            { q: "ポコピーの彼女の名前は何？", a: "下 (3) ：ポコナ" },
            { q: "キノコタウンにある遊戯場に入る土管は何をしたら出てくる？", a: "中 (2) ：木をたたく" },
            { q: "キノコタウンの港のレストランには次のうち誰がいる？", a: "下 (3) ：うた姫" },
            { q: "ヘイホーがしていないことは次のうちどれ？", a: "上 (1) ：うたう" },
            { q: "マリオとルイージの関係は？", a: "下 (3) ：兄弟" },
            { q: "次のうち星のうまれる谷にいるのは？", a: "下 (3) ：ハックン" },
            { q: "マリオが連れている仲間 全部で何人？", a: "中 (2) ：８人" },
            { q: "ピーチ姫と一緒にいる星の子の名前は？", a: "中 (2) ：ティンク" },
            { q: "今までにマリオが助け出した 星の精は全部で何人？", a: "中 (2) ：７人" }
        ];

        const updateQuizNavigation = (currentCount) => {
            const numText = document.getElementById('quizNumberText');
            const qText = document.getElementById('quizQuestionText');
            const aText = document.getElementById('quizAnswerText');
            
            if (currentCount >= 64) {
                numText.textContent = "全問終了";
                qText.textContent = "お疲れ様でした！ハテナ虫全問クリアです！";
                aText.textContent = "おめでとうございます！";
                return;
            }

            const currentQuiz = quizList[currentCount];
            numText.textContent = `次の問題: Q${currentCount + 1}`;
            qText.textContent = currentQuiz.q;
            aText.textContent = currentQuiz.a;
        };

        const cards = document.querySelectorAll('.card');
        const itemStates = [];

        cards.forEach((card, index) => {
            const display = card.querySelector('.count-display');
            const maxCount = parseInt(card.getAttribute('data-max')) || 100;
            let count = 0;

            const updateDisplay = () => {
                display.textContent = `${count} / ${maxCount}`;
                if (index === 0) updateQuizNavigation(count);
            };

            itemStates.push({
                plus: () => { if (count < maxCount) { count++; updateDisplay(); } },
                minus: () => { if (count > 0) { count--; updateDisplay(); } },
                reset: () => { count = 0; updateDisplay(); }
            });
            updateDisplay();
        });

        // リセットボタン
        document.getElementById('appResetBtn').addEventListener('click', () => {
            if (confirm("すべてのカウントをリセットして0に戻しますか？")) {
                itemStates.forEach(state => state.reset());
            }
        });

        // --- NW.js 専用処理 ---
        if (typeof nw !== 'undefined') {
            const nwWin = nw.Window.get();
            
            // 💥 3行化に合わせてウィンドウの縦幅を 780 から 820 へ拡張
            nwWin.resizeTo(860, 820);
            nwWin.setMinimumSize(860, 820);
            nwWin.setMaximumSize(860, 820);

            // ホットキー設定
            const keys = ['1', '2'];
            keys.forEach((keyName, idx) => {
                const shortcutPlus = new nw.Shortcut({ key: keyName });
                shortcutPlus.on('active', () => { itemStates[idx].plus(); });
                nw.App.registerGlobalHotKey(shortcutPlus);

                const shortcutMinus = new nw.Shortcut({ key: `Ctrl+${keyName}` });
                shortcutMinus.on('active', () => { itemStates[idx].minus(); });
                nw.App.registerGlobalHotKey(shortcutMinus);
            });

            document.getElementById('appKillBtn').addEventListener('click', () => {
                if (typeof process !== 'undefined' && process.exit) { process.exit(0); }
            });

            nwWin.on('close', () => {
                if (typeof process !== 'undefined' && process.exit) { process.exit(0); }
            });
        }
    </script>

</body>
</html>
